[project]
name = "netribeat"
version = "0.1.0"
description = "NetriBeat — heart rate, training load and HRV analysis from ECG chest-strap recordings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159,<1",
    "starlette>=1.3.1",  # security floor: PYSEC-2026-161/248/249/1942/2280/2281
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<6",
    "arq>=0.26,<0.27",
    "python-multipart>=0.0.18,<0.1",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "reportlab>=4.2,<5",
    "matplotlib>=3.9,<4",
]

[project.scripts]
netribeat = "netribeat.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",  # security floor: PYSEC-2026-1845
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<0.29",
    "hypothesis>=6.118,<7",
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "scipy-stubs>=1.14",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netribeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: long-running tests",
    "redis: needs a running Redis",
]
filterwarnings = ["error::DeprecationWarning:netribeat.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = ["S101", "B008", "RUF012", "N818", "RUF001", "RUF002", "RUF003"]
# N818: AppError names are fixed by CLAUDE.md. RUF001-3: scientific symbols (−, ×, –) are intended.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
packages = ["netribeat"]

[tool.coverage.run]
source = ["netribeat"]
branch = true
# SQLAlchemy's async layer runs ORM code on greenlets; trace them too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
