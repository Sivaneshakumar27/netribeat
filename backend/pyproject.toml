[project]
name = "netribeat"
version = "0.1.0"
description = "NetriBeat backend — accounts, email, hex-file sessions and reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159,<1",
    "starlette>=1.3.1",  # security floor: PYSEC-2026-161/248/249/1942/2280/2281
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<6",
    "python-multipart>=0.0.18,<0.1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
]

[project.scripts]
netribeat = "netribeat.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netribeat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Reference engine code (SES-4 / SES-7), kept as written: never reformat it.
extend-exclude = [
    "src/netribeat/hex_decoder/decode_hex.py",
    "src/netribeat/engine/algo/common.py",
    "src/netribeat/engine/algo/hr",
    "src/netribeat/engine/algo/max_min_avg_hr",
    "src/netribeat/engine/algo/training_load",
    "src/netribeat/engine/algo/movement_load",
    "src/netribeat/engine/derived_metrics.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = ["S101", "B008", "RUF012", "N818", "RUF001", "RUF002", "RUF003"]
# N818: AppError names are fixed by CLAUDE.md. RUF001-3: scientific symbols (−, ×, –) are intended.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
packages = ["netribeat"]
exclude = [
    'src/netribeat/hex_decoder/decode_hex\.py',
    'src/netribeat/engine/algo/common\.py',
    'src/netribeat/engine/algo/hr',
    'src/netribeat/engine/algo/max_min_avg_hr',
    'src/netribeat/engine/algo/training_load',
    'src/netribeat/engine/algo/movement_load',
    'src/netribeat/engine/derived_metrics.py',
]

[[tool.mypy.overrides]]
module = [
    "netribeat.hex_decoder.decode_hex",
    "netribeat.engine.algo.common",
    "netribeat.engine.algo.hr.*",
    "netribeat.engine.algo.max_min_avg_hr.*",
    "netribeat.engine.algo.training_load.*",
    "netribeat.engine.algo.movement_load.*",
    "netribeat.engine.derived_metrics",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true
follow_imports = "skip"
