openapi: 3.0.3
info:
  title: NetriBeat API
  version: 0.1.0
  description: |
    Backend for the NetriBeat frontend (`prototype/netribeat.html`).

    **Flow**
    1. `POST /auth/login` → bearer token.
    2. `POST /sessions` (upload) → `202`, session `status: processing`.
    3. Poll `GET /sessions/{id}` until `status` is `ready` (or `failed`).
    4. `GET /sessions/{id}/analysis` and `GET /sessions/{id}/signals` to draw the session view.

    **Rules**
    - All signal processing runs on the backend. Formulas and constants: `docs/design-spec.md` → *Metric definitions*.
    - Athletes are identified by email (trimmed, lower-cased). No separate athlete creation step.
    - Max HR is an athlete-level setting (`PUT /athletes/{email}/hr-max`). Which value applies: athlete's saved setting → else the session's upload override (`hrMaxManual`) → else 210 − age.
    - Units: time in seconds (`…S`), RR in milliseconds, HR in bpm, loads in AU, frequency in Hz, power in ms².
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Athletes
  - name: Sessions

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user (restore a session on page load)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password-reset email
      description: Always returns 204, whether or not the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Request accepted }

  /athletes:
    get:
      tags: [Athletes]
      summary: List athletes (upload-form email suggestions, sessions filter, Settings page)
      responses:
        '200':
          description: Athletes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Athlete' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /athletes/{email}/hr-max:
    parameters:
      - name: email
        in: path
        required: true
        description: Athlete email, URL-encoded
        schema: { type: string, format: email }
    put:
      tags: [Athletes]
      summary: Save the athlete's max HR setting (Settings page → Save max HR)
      description: Recalculates zones, time in zones and training load for all of this athlete's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrMaxSetting' }
            example: { method: manual, manual: 192 }
      responses:
        '200':
          description: Saved; returns the updated athlete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Athlete' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions (Dashboard, Sessions page)
      description: Newest first by `recordedAt`. `stats` covers all rows matching the filter, not just this page.
      parameters:
        - name: email
          in: query
          description: Only this athlete
          schema: { type: string, format: email }
        - name: q
          in: query
          description: Free-text search over email, file name and session type
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Sessions]
      summary: Upload a recording (New recording page)
      description: |
        Stores the files and starts analysis. Returns immediately with `status: processing`.
        File kind is inferred from the file name: contains `acc`/`imu`/`motion` → `acc`; `hr`/`heart` → `hr`; `ecg` → `ecg`; otherwise `rr`.
        At least one `rr` or `ecg` file is required. Max 50 MB per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, age, type, recordedAt, device, files]
              properties:
                email: { type: string, format: email, example: priya.raman@example.org }
                age: { type: integer, minimum: 8, maximum: 100, example: 29 }
                hrMaxManual:
                  type: integer
                  minimum: 100
                  maximum: 230
                  nullable: true
                  description: Optional max HR override. Omit for 210 − age.
                type: { $ref: '#/components/schemas/SessionType' }
                recordedAt: { type: string, format: date-time, example: '2026-09-28T07:12:00+05:30' }
                device: { $ref: '#/components/schemas/Device' }
                notes: { type: string, maxLength: 500 }
                files:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
            encoding:
              files:
                contentType: application/octet-stream
      responses:
        '202':
          description: Accepted, analysis running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: A file is larger than 50 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: Session details and processing status (Session view header)
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: All computed results (Overview, Heart rate, HRV, Load tabs)
      description: Zones, time in zones and training load use the max HR that applies to this athlete (see the rule at the top). `hrMax` in the response says which value and source were used.
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analysis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is not `ready` yet (or `failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/signals:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: Time series for charts (HR over time, ECG strip, beat-to-beat, Poincaré, sparklines)
      responses:
        '200':
          description: Signals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Signals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is not `ready` yet (or `failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/report:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      summary: Download the session report (Export report button)
      responses:
        '200':
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is not `ready` yet (or `failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, example: sess-14 }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_error
            message: Some fields are invalid
            fields:
              age: Age 8–100 is needed for age-based max HR
    Unauthorized:
      description: Missing or invalid token / wrong credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- shared ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string, example: Session not found }
        fields:
          type: object
          description: Per-field messages (validation errors only)
          additionalProperties: { type: string }

    SessionType:
      type: string
      enum: [rest, training, match, recovery, test]
      description: rest = Rest / baseline · training · match = Match / competition · recovery · test = Test protocol

    Device:
      type: string
      enum: [chest_strap_rr_acc, chest_strap_rr, ecg_holter, optical_wrist, other]

    FileKind:
      type: string
      enum: [rr, ecg, hr, acc]

    Quality:
      type: string
      enum: [good, poor, no_ecg]
      description: no_ecg if < 30 RR intervals · poor if artefacts > 5 % · else good

    SessionStatus:
      type: string
      enum: [processing, ready, failed]

    HrMaxMethod:
      type: string
      enum: [age, peak, manual]
      description: age = 210 − age · peak = highest max HR across this athlete's sessions · manual = user value

    HrMaxSetting:
      type: object
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/HrMaxMethod' }
        manual:
          type: integer
          minimum: 100
          maximum: 230
          nullable: true
          description: bpm; required when method = manual

    # ---------- auth ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean, default: true, description: '"Keep me signed in" — longer token expiry' }

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    # ---------- athletes ----------
    Athlete:
      type: object
      required: [email, sessionCount, hrMaxValue]
      properties:
        email: { type: string, format: email }
        sessionCount: { type: integer }
        lastRecordedAt: { type: string, format: date-time }
        age: { type: integer, description: Age from the latest session }
        peakMaxHr: { type: number, description: Highest session max HR (bpm) — the `peak` option value }
        hrMaxSetting:
          allOf: [{ $ref: '#/components/schemas/HrMaxSetting' }]
          nullable: true
          description: Saved setting; null when none saved (age-based applies)
        hrMaxValue: { type: integer, description: Max HR currently used for this athlete (bpm), example: 181 }

    # ---------- sessions ----------
    SessionSummary:
      type: object
      description: One row in the sessions table
      required: [id, email, type, recordedAt, durationS, status]
      properties:
        id: { type: string, example: sess-14 }
        email: { type: string, format: email }
        type: { $ref: '#/components/schemas/SessionType' }
        recordedAt: { type: string, format: date-time }
        durationS: { type: integer, example: 1800 }
        status: { $ref: '#/components/schemas/SessionStatus' }
        quality: { $ref: '#/components/schemas/Quality' }
        avgHr: { type: number, example: 139.4 }
        maxHr: { type: number, example: 177.1 }
        rmssd: { type: number, nullable: true, description: 'ms; null when quality = no_ecg', example: 42.3 }
        trainingLoad: { type: number, description: Edwards TRIMP (AU), example: 98.6 }
        movementLoad: { type: number, nullable: true, description: AU; null without an ACC file }
        fileName: { type: string, description: Main RR/ECG file name, example: S014_run_2026-09-28.csv }

    SessionList:
      type: object
      required: [items, total, stats]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
        total: { type: integer }
        stats:
          type: object
          description: Over all rows matching the filter
          properties:
            sessions: { type: integer }
            athletes: { type: integer }
            recordedTimeS: { type: integer }
            avgRmssd: { type: number, nullable: true }

    FileInfo:
      type: object
      required: [name, kind, sizeBytes]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/FileKind' }
        sizeBytes: { type: integer }

    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [age, device, files]
          properties:
            age: { type: integer }
            device: { $ref: '#/components/schemas/Device' }
            notes: { type: string, nullable: true }
            hrMaxManual: { type: integer, nullable: true }
            files:
              type: array
              items: { $ref: '#/components/schemas/FileInfo' }
            artefactCount: { type: integer, description: Beats corrected (drives the banner) }
            artefactPct: { type: number, example: 1.2 }
            hrvWindowS:
              type: array
              description: '[start, end] of the HRV window in seconds'
              items: { type: number }
              minItems: 2
              maxItems: 2
              example: [0, 300]
            error: { type: string, nullable: true, description: Reason when status = failed }

    # ---------- analysis ----------
    Band:
      type: object
      properties:
        rangeHz:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          example: [0.04, 0.15]
        peakHz: { type: number, nullable: true }
        power: { type: number, description: ms² }
        powerPct: { type: number, description: '% of VLF+LF+HF' }
        powerNu: { type: number, nullable: true, description: 'Normalised units; LF and HF only' }

    Analysis:
      type: object
      properties:
        hrMax:
          type: object
          required: [value, method]
          properties:
            value: { type: integer, example: 181 }
            method: { $ref: '#/components/schemas/HrMaxMethod' }
            label: { type: string, example: Age-based }
            detail: { type: string, example: '210 − age (age 29)' }
        hr:
          type: object
          properties:
            min: { type: number }
            avg: { type: number }
            max: { type: number }
        timeInZonesS:
          type: object
          description: Seconds per zone (zones = % of hrMax.value)
          properties:
            belowZ1: { type: number }
            z1: { type: number }
            z2: { type: number }
            z3: { type: number }
            z4: { type: number }
            z5: { type: number }
        trainingLoad: { type: number, description: Edwards TRIMP (AU) }
        movementLoad: { type: number, nullable: true, description: AU }
        beats:
          type: object
          properties:
            detected: { type: integer }
            artefacts: { type: integer }
            artefactPct: { type: number }
        timeDomain:
          type: object
          description: HRV window, corrected RR
          properties:
            meanRr: { type: number, description: ms }
            meanHr: { type: number, description: bpm }
            sdnn: { type: number, description: ms }
            rmssd: { type: number, description: ms }
            pnni20: { type: number, description: '%' }
            pnni50: { type: number, description: '%' }
            beats: { type: integer }
        frequencyDomain:
          type: object
          description: Lomb–Scargle PSD of the HRV window
          properties:
            freqs:
              type: array
              items: { type: number }
              description: Hz
            power:
              type: array
              items: { type: number }
              description: ms²/Hz, same length as freqs
            bands:
              type: object
              properties:
                vlf: { $ref: '#/components/schemas/Band' }
                lf: { $ref: '#/components/schemas/Band' }
                hf: { $ref: '#/components/schemas/Band' }
            totalPower: { type: number, description: ms² }
            lfHf: { type: number }
        poincare:
          type: object
          properties:
            sd1: { type: number, description: ms }
            sd2: { type: number, description: ms }
            sd1Sd2: { type: number }
        respiratoryRate:
          type: object
          properties:
            value: { type: number, description: breaths/min }
            hfPeakHz: { type: number }

    # ---------- signals ----------
    Signals:
      type: object
      properties:
        hr:
          type: object
          description: 1 Hz heart rate (HR over time chart)
          properties:
            tS:
              type: array
              items: { type: number }
            bpm:
              type: array
              items: { type: number }
        rrRawMs:
          type: array
          items: { type: number }
          description: RR before correction (HRV window)
        rrCorrectedMs:
          type: array
          items: { type: number }
          description: RR after correction, same length as rrRawMs
        artefactIndices:
          type: array
          items: { type: integer }
          description: Indices into the RR arrays that were corrected
        ecgStrip:
          type: object
          nullable: true
          description: First 10 s of raw ECG; null when no ECG
          properties:
            fs: { type: integer, description: Sampling rate (Hz), example: 250 }
            lead: { type: string, example: ECG · chest strap }
            signal:
              type: array
              items: { type: number }
              description: mV
            rPeaks:
              type: array
              items: { type: integer }
              description: Sample indices of detected R peaks
        perMinute:
          type: object
          description: Sparklines on the Load & respiration tab
          properties:
            movementLoad:
              type: array
              items: { type: number }
              nullable: true
            respiratoryRate:
              type: array
              items: { type: number }
